name: Clarity PM - Deploy VPS

on:
  workflow_run:
    workflows: ["Clarity PM - CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clarity-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy validated main revision
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch origin ${{ github.event.workflow_run.head_sha }}
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            docker compose config --quiet
            docker compose build --pull app
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:${APP_PORT:-3000}/api/health >/dev/null; then
                echo "Clarity PM deployment healthy"
                exit 0
              fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=120 app postgres
            exit 1
