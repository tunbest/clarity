name: Clarity PM - Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fetch source, build and deploy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub secret ${name} is missing"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -T 10 -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact pushed commit on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='/root/vp' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v git >/dev/null 2>&1 || { echo "Git is not installed." >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed." >&2; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose plugin is missing." >&2; exit 1; }

          PARENT_DIR="$(dirname "$APP_DIR")"
          mkdir -p "$PARENT_DIR"

          # Keep the existing directory instead of deleting user files.
          # If it is not a Git checkout, move it aside and reuse its .env if present.
          if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then
            BACKUP_DIR="${APP_DIR}.predeploy.$(date +%Y%m%d%H%M%S)"
            echo "Existing non-Git directory found; preserving it at: $BACKUP_DIR"
            mv "$APP_DIR" "$BACKUP_DIR"
            mkdir -p "$APP_DIR"
            if [ -f "$BACKUP_DIR/.env" ]; then
              install -m 600 "$BACKUP_DIR/.env" "$APP_DIR/.env"
            fi
          fi

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --no-checkout https://github.com/tunbest/clarity.git "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin https://github.com/tunbest/clarity.git
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach --force "$DEPLOY_SHA"

          test -f .env || { echo "Production .env is missing on the VPS ($APP_DIR/.env)." >&2; exit 1; }
          if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ] && [ ! -f docker-compose.yaml ]; then
            echo "No Docker Compose file found in $APP_DIR." >&2
            exit 1
          fi

          docker compose config --quiet
          docker compose up -d --build --remove-orphans

          healthy=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done

          docker compose ps
          if [ "$healthy" -ne 1 ]; then
            docker compose logs --tail=120 app postgres || true
            echo "Clarity health check failed." >&2
            exit 1
          fi

          echo "Clarity PM deployed successfully: $DEPLOY_SHA"
          REMOTE
