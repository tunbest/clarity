name: Deploy Clarity PM to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clarity-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR VPS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub secret ${name} is missing"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' REPO_URL='https://github.com/tunbest/clarity.git' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the VPS." >&2
            exit 1
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is not installed on the VPS." >&2
            exit 1
          fi

          mkdir -p "$APP_DIR"
          if [ ! -d "$APP_DIR/.git" ]; then
            if [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "APP_DIR exists and is not empty, but is not a Git checkout: $APP_DIR" >&2
              exit 1
            fi
            git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          if [ ! -f .env ]; then
            echo "Missing production .env in $APP_DIR. Create it on the VPS; never commit it." >&2
            exit 1
          fi
          if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ] && [ ! -f docker-compose.yaml ]; then
            echo "No Docker Compose file found in $APP_DIR." >&2
            exit 1
          fi

          docker compose config --quiet
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE
