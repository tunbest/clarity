name: Clarity PM - Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fetch source, build and deploy on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub secret ${name} is missing"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -T 10 -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact pushed commit on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='/root/vp' STACK_DIR='/root/clarity-prod' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          command -v git >/dev/null 2>&1 || { echo "Git is not installed." >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed." >&2; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose plugin is missing." >&2; exit 1; }

          # The source checkout and the live Compose project are intentionally separate.
          # Never recreate the PostgreSQL volume or replace the production .env.
          test -d "$STACK_DIR" || { echo "Production stack directory is missing: $STACK_DIR" >&2; exit 1; }
          test -f "$STACK_DIR/docker-compose.yml" || { echo "Production Compose file is missing." >&2; exit 1; }
          test -f "$STACK_DIR/.env" || { echo "Production environment file is missing." >&2; exit 1; }
          grep -q '^CLOUDFLARE_AI_SECRET=.' "$STACK_DIR/.env" || { echo "CLOUDFLARE_AI_SECRET is missing from production .env." >&2; exit 1; }
          grep -q '^CLOUDFLARE_AI_URL=.' "$STACK_DIR/.env" || { echo "CLOUDFLARE_AI_URL is missing from production .env." >&2; exit 1; }
          # Generate one stable, private service-to-service API key if not provisioned yet.
          if ! grep -q '^PROJECT_ANALYSIS_API_KEY=.' "$STACK_DIR/.env"; then
            echo "PROJECT_ANALYSIS_API_KEY=$(openssl rand -hex 32)" >> "$STACK_DIR/.env"
            chmod 600 "$STACK_DIR/.env"
          fi
          test -f "$STACK_DIR/db-init/01-create-app-role.sh" || test -f "$STACK_DIR/db-init/sync-app-role.sh" || { echo "Database role initialization/sync script is missing." >&2; exit 1; }
          docker network inspect shared_network >/dev/null 2>&1 || { echo "External Docker network shared_network is missing." >&2; exit 1; }

          mkdir -p "$(dirname "$APP_DIR")"
          if [ ! -d "$APP_DIR/.git" ]; then
            if [ -e "$APP_DIR" ] && [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              BACKUP_DIR="${APP_DIR}.predeploy.$(date +%Y%m%d%H%M%S)"
              echo "Preserving pre-existing source directory at: $BACKUP_DIR"
              mv "$APP_DIR" "$BACKUP_DIR"
            fi
            git clone --no-checkout https://github.com/tunbest/clarity.git "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin https://github.com/tunbest/clarity.git
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach --force "$DEPLOY_SHA"

          for file in Dockerfile package.json scripts/build-server.mjs server.ts src/db/dbClient.ts; do
            test -f "$APP_DIR/$file" || { echo "Required source file missing: $file" >&2; exit 1; }
          done
          test -f "$APP_DIR/.dockerignore" || { echo ".dockerignore is missing; refusing to build with a potentially unsafe context." >&2; exit 1; }

          # Temporary Compose override: reuse the live project, env, network and DB volume,
          # while building only the app image from the freshly checked-out source.
          OVERRIDE_FILE="$STACK_DIR/docker-compose.deploy.yml"
          cleanup() { rm -f "$OVERRIDE_FILE"; }
          trap cleanup EXIT
          cat > "$OVERRIDE_FILE" <<'YAML'
          services:
            app:
              env_file:
                - /root/clarity-prod/.env
              environment:
                PROJECT_ANALYSIS_API_URL: http://project-analysis-api:8000
              build:
                context: /root/vp
                dockerfile: Dockerfile
            project-analysis-api:
              build:
                context: /root/vp/project-analysis-api
                dockerfile: Dockerfile
              env_file:
                - /root/clarity-prod/.env
              environment:
                DATABASE_URL: ""
                POSTGRES_HOST: postgres
                POSTGRES_PORT: "5432"
                GEMINI_MODEL: gemini-3.8-flash
              restart: unless-stopped
              expose:
                - "8000"
              networks:
                - shared_network
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 30s
          YAML

          COMPOSE=(docker compose --project-directory "$STACK_DIR" --env-file "$STACK_DIR/.env" -f "$STACK_DIR/docker-compose.yml" -f "$OVERRIDE_FILE")

          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" up -d --build app project-analysis-api

          healthy=0
          for attempt in $(seq 1 36); do
            if "${COMPOSE[@]}" exec -T app curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done

          "${COMPOSE[@]}" ps
          if [ "$healthy" -ne 1 ]; then
            "${COMPOSE[@]}" logs --tail=150 app postgres db-credentials-sync || true
            echo "Clarity health check failed. The existing PostgreSQL volume was not removed." >&2
            exit 1
          fi

          echo "Clarity PM deployed successfully: $DEPLOY_SHA"
          REMOTE
