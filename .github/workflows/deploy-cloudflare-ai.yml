name: Deploy Clarity AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "cloudflare-ai/**"
      - ".github/workflows/deploy-cloudflare-ai.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLARITY_AI_SECRET: ${{ secrets.CLARITY_AI_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLARITY_AI_SECRET" || (echo "::error::Missing CLARITY_AI_SECRET" && exit 1)

      # Deploy first so the Worker script exists before Wrangler writes its secret.
      - name: Deploy Worker
        working-directory: cloudflare-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          wrangler deploy --config wrangler.toml

      - name: Configure Worker secret
        working-directory: cloudflare-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLARITY_AI_SECRET: ${{ secrets.CLARITY_AI_SECRET }}
        run: |
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')"
          CLARITY_AI_SECRET="$(printf '%s' "$CLARITY_AI_SECRET" | tr -d '\r\n')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$CLARITY_AI_SECRET" | wrangler secret put CLARITY_AI_SECRET --config wrangler.toml
          echo "Cloudflare Worker authentication secret configured successfully."
